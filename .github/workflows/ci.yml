name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Build all workspaces
        run: npm run build

      - name: Unit tests
        run: npm test

      # Code scanning (CodeQL) requires a public repo; this keeps a dependency
      # security signal while the repository is private. Non-blocking by design.
      - name: Dependency audit (non-blocking)
        run: npm audit --audit-level=high || echo "::notice::audit findings present — triage scheduled post-submission"
