name: Bug report
description: Report something broken or incorrect
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Expected vs actual behavior, with the exact error text.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - web (frontend)
        - api (backend)
        - n8n workflows
        - supabase (db/auth/storage)
        - buffer integration
        - deployment
        - other
    validations:
      required: true
