services:
  n8n:
    # TODO: pin to a tested stable version after the first successful local run.
    image: n8nio/n8n:latest
    container_name: flowtofeed-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Karachi
      - TZ=Asia/Karachi
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_RUNNERS_ENABLED=true
      # Gemma access from workflow nodes (owner uses LLM_* aliases in root .env)
      - GEMMA_API_KEY=${LLM_API_KEY:-${GEMMA_API_KEY:-}}
      - GEMMA_MODEL=${LLM_MODEL:-gemma-4-26b-a4b-it}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_LOG_LEVEL=debug
      - EXECUTIONS_TIMEOUT=1800
      - EXECUTIONS_TIMEOUT_MAX=1800
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
